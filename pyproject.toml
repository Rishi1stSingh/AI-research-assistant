[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[project]
name = "ai-research-assistant"
version = "0.1.0"
description = "AI Research Assistant"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "streamlit",
    "python-dotenv",
    "langgraph",
    "langchain",
    "langchain-core",
    "langchain-groq",
    "langchain-tavily",
    "tavily-python",
    "pydantic",
]
